## Statistics with Eigenmath       § 3.1-104
##            by Dr. W.G. Lindner  2026
 
pi = float(pi)

"==================================  normCDF -  normal density"

  normPDF(x,mu,sigma) = 
              1/sqrt(2.*pi)/sigma*exp(-0.5*((x-mu)/sigma)^2)

  phi(x,mu,sigma) = normPDF(x,mu,sigma)      -- classic notation

------------------------------------------------------------ 

"--- Check with R"

-- R> # Create 10 numbers between 0 and 2 incrementing by 0.1:
-- R> x <- seq(0, 1, by = .1)
-- R> # Choose the mean as 0 and standard deviation as 1:
-- R> dnorm(x, mean = 0, sd = 1)
--    [1] 0.39894228 0.39695255 0.39104269 0.38138782 0.36827014 ..
-- We collect these values in vector R to compare with Eigenmath.

R = (0.39894228, 0.39695255, 0.39104269, 0.38138782, 0.36827014, 
     0.35206533, 0.33322460, 0.31225393, 0.28969155, 0.26608525, 
     0.2419707)

"normal distribution for z = 0.0, 0.1, 0.2, .., 1.0" 
"     i      Em               R                 Em=Eigenmath" 
T = zero(3,11)     -- T is a 3x11 table (matrix)
for(i,1,11, T[1,i] = 0.1*(i-1))
for(i,1,11, T[2,i] = normPDF((i-1)*0.1,0,1))
for(i,1,11, T[3,i] = R[i])
transpose(T)
"ok"
