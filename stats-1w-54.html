## Statistics with Eigenmath      § 1.13-54
##            by Dr. W.G. Lindner  2026

"Covariance"

mean(X)       = float( sum(X)/dim(X) )  

------------------------------------------------------ cov

  cov(X,Y)  = 1/dim(X)     * sum( (X-mean(X)) * (Y-mean(Y)) )

  covR(X,Y) = 1/(dim(X)-1) * sum( (X-mean(X)) * (Y-mean(Y)) )
                             -- R method 'pearson'
------------------------------------------------------ END


"Example"

X =( 16.50, 19.16,  7.64,  8.14,  8.14,  2.48,
      9.23,  4.78,  6.93, 11.91, 11.60, 13.97)

Y =( 16.50, 19.16,  7.64,  8.14,  8.14,  2.48,
      9.23,  4.78,  6.93, 11.91, 11.60, 13.97)

cov(X,Y)
covR(X,Y)
