X := {4 ,36, 45, 50, 75};

procedure SUM1(lst); 
          for i := 1:length(X) sum part(X, i)$
          
sum1(X);

procedure xapply(f,lst); 
          lisp(f.cdr(lst))$
          
procedure mean(lst);  
          xapply(+, lst)/length(lst)$
          
mean({4 ,36, 45, 50, 75});

on rounded;
