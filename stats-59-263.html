"========== EXAMPLE: Duke Uni example"

-- see: https://www.askpython.com/python/examples/bootstrap-sampling-introduction

-- Ten university students were recruited to play the seminal video 
-- game pac-man. After equal amounts of practice the students were 
-- then asked to play the first stage and the time to completion was -- recorded. The following data in seconds were recorded.

X = (63.1,64.6,63.4,65.6,63.4,65.7,64.6,63.1,65.9,63.3)

-- Calculate the 95% confidence interval CI, which catch the true 
-- population mean.

-- SOLUTON:

-- Because we do not know the population variance, the 
-- sample standard deviation sd() can be used as a subsitute.
-- For a finite-length vector X made up of N = dim(X) scalar 
-- observations, the standard deviation is defined as

sd(X) = float( sqrt(sum((X-mean(X))^2) /(dim(X)-1)) )

sX = sd(X)
sX              
-- ok: std.dev. of X = 1.148960883194511

-- now we calculate the confidence interval for the estimated mean
-- at a significance level alpha = 0.05

alpha = 0.05

-- To calculate the confidence interval CI we need tINV.
--------------------------------------------------------------
   tINV(x, df) = tdistinv(x, df)
--------------------------------------------------------------

interval = tINV(1 - (alpha/2),n-1) * (sX/sqrt(n))
interval

ci = (mean(X) - interval, mean(X) + interval)
ci

-- RESULT
-- We are 95% confident that the true population mean lies 
-- between 63.45 and 65.09.
"ok"
