"=============================== CDF for PARETO distribution"

  paretoCDF(x,m,a) = test( x<m, 0, 
                     float( 1 - (m/x)^a  ))
-------------------------------------------------------------

"--- EXAMPLE (R). ---"

-- 
-- The cdf of a Pareto distribution with parameters location=2 and 
-- shape=1, evaluated at 3, 4, and 5 is 
-- SOLUTION:

paretoCDF(3, 2,1) 
paretoCDF(4, 2,1) 
paretoCDF(5, 2,1) 
"ok"
