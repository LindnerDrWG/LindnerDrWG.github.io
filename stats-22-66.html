## Statistics with Eigenmath      § 2.2-66
##            by Dr. W.G. Lindner  2026
 

"=============================== geoPDF - GEOMETRIC density"

   geoPDF(k,p) = float( p*(1-p)^k  )

----------------------------------------------------------

"--- a. --- Geometrical PDF table for k=0..10, p=1/6"
T = zero(2,11)
for(i,0,10, T[1,i+1] = i)
for(i,0,10, T[2,i+1] = float(geoPDF(i, 1/6)) )
transpose(T)

"--- b. --- Geometrical PDF plot for k=0..10, p=1/6"
yrange = (0,0.2)
xrange = (0,10)
draw( geoPDF(x, 1/6), x)  -- warning: plot is 'continous'

y = T[2]
draw(y[floor(x)],x)       -- draw version 2
