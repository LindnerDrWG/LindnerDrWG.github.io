"========================= WILCOXON two sample signed rank test"

"........... Prerequisites: sort, cRank, correspond, normCDF"
normCDF(L, mu,sigma) = 
                1/2 + 1/2*float(erf((L-mu)/(sqrt(2)*sigma)))

sort(v,i,k,n,t) = do( n = dim(v),       
     loop( test(n < 2, break), k = 1,
           for(i, 1, n - 1,
               test(v[i] > v[i + 1], 
                 do( t = v[i], v[i] = v[i + 1], v[i + 1] = t,
                     k = i ))), n = k), v)

cRank(W, i,j,k,n,t, Srank) = do(            -- by G. Weigt 8/25  
         j = 1, n = dim(W), Srank = 0,
         loop( test(j > n, break),
               k = j + 1,
               loop( test(k > n, break, W[j]==W[k], k=k+1, break)),
               t = 0.5*(j + k - 1),
               for(i, j, k-1, W[i] = t),
               t = k - j,
               Srank = Srank + t^3 - t,
               j = k), Srank,W)

correspond(X,sX, M) = do(   -- X and sortedX, by W. Lindner 7/25
    M=zero(dim(X)),
    for(j,1,dim(X),
    for(i,1,dim(X), test(sX[i]=X[j], M[j]=cRank(sX)[i]))), M)

min(a,b) = test(a<=b, a,b)

############################################################
  signrank2(X,Y, n,d,sd,cd,Wp,Wm,T) = do(
############################################################
     n    = dim(Y),
     d    = zero(n),
     d = X - Y,         
     md = mag(d),       
     sd = sort(md),     
     cd = correspond(md,sd),     
     Tp = zero(n),       -- T+
     Tm = zero(n),       -- T-
     To = zero(n),       -- T0, summ the 0 values
     for(i,1,n, test(d[i] >0, Tp[i]=1)),
     for(i,1,n, test(d[i] <0, Tm[i]=1)),
     for(i,1,n, test(d[i]==0, To[i]=1)),
     Wp = dot(Tp,cd),     -- sum via inner product
     Wm = dot(Tm,cd),
     T = min(Wp,Wm),
     print("___ signrank2 ___"),
     (("Wp","Wm", "T"),(Wp,Wm,T)) )
######################################################## END

"------ solve problem of figure.35"

X = (7.8, 6.6, 6.5, 7.4, 7.3, 7.0, 6.4, 7.1, 6.7, 7.6, 6.8)
Y = (7.0, 7.6, 6.5, 9.0, 7.3, 6.0, 4.4, 8.1, 4.2, 7.8, 5.8)

signrank2(X,Y)
