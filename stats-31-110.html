## Statistics with Eigenmath       § 3.1-110
##            by Dr. W.G. Lindner  2026
 
pi = float(pi)

"============================== normCDF - normal cumulative"

  normCDF(x, mu,sigma) = 
                  1/2 + 1/2*float(erf((x-mu)/(sqrt(2)*sigma)))

  stdnormCDF(x) = normCDF(x, 0,1)          -- standard normal CDF
  Phi(x)        = stdnormCDF(x)            -- classic notation

--------------------------------------------------------------

"------  EXAMPLE: resistors I"

-- A factory produces 100 Ω resistors, distributed via
-- N(100,6^2). What proportion of the resistors have 
-- a maximum deviation of 10% from the mean value? Cf.[4], p.51

-- SOLUTION:  result: 0.90442, i.e. 90,4% are first class.
--            Pr(90<X<110) = Pr(X<110) - Pr(X<90) =

Phi((110-100)/6) - Phi((90-100)/6)

normCDF(110,100,6) - normCDF(90,100,6) 

"ok"     

------------------------ normCDF2 : Calculate Pr( a<=X<=b )

normCDF2(a,b,mu,sigma) = 
             1/2 * float( erf( (b-mu)/(sigma*sqrt(2)) )) -
             1/2 * float( erf( (a-mu)/(sigma*sqrt(2)) ))

------------------------------------------------------------

--       a b  mu sigma
normCDF2(1,2, 0, 1)

"------ EXAMPLE: resistors II"
-- SOLUTION:  Pr(90<X<110) = 

normCDF2(90,110,  100,6)
"ok"
