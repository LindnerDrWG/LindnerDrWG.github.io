procedure mad(lst);
begin
  scalar n, mu, diff_sum;
  n        := length(lst);  
  mu       := for i := 1:n sum part(lst, i)/n;  % mean
  diff_sum := for i := 1:n sum abs(part(lst, i) - mu);
  return diff_sum/n;
end;

from functools import reduce

def my_cum_sum(arg):
    return reduce(lambda a, x: (a.append(a[-1] + x)) if len(a) > 0 else a.append(x), arg, [])

assert(my_cum_sum([1, 1, 1, 1]) == [1, 2, 3, 4]))

from itertools import accumulate

def my_cum_sum(arg) -> list:
  result = accumulate(arg)
  return list(result)

assert(my_cum_sum([1, 1, 1, 1]) == [1, 2, 3, 4])

from functools import reduce

def my_cum_sum(arg):
    return reduce(lambda a, x: a.append(a[-1] + x if a else x) or a, arg, [])

assert(my_cum_sum([1, 1, 1, 1]) == [1, 2, 3, 4])

procedure  median(X);
begin
  scalar  Xs,n2,n2p; % local vars
          Xs   := sortnumlist X; 
          n2   := floor(length(X)/2);  
          n2p  := n2+1;
          if evenp length(X) 
             then return 0.5*(part(Xs,n2)+part(Xs,n2p))
             else return  part(Xs,n2p); 
end;
