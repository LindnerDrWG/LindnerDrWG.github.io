load_package assist;  % for sortnumlist
                    
procedure  median(X);
begin
  scalar  Xs,n2,n2p; % local vars
          Xs   := sortnumlist X; 
          n2   := floor(length(X)/2);  
          n2p  := n2+1;
          if evenp length(X) 
             then return  0.5*(part(Xs,n2)+part(Xs,n2p))
             else return  part(Xs,n2p); 
end;

median({4,36,45,50,70 }); 

procedure mad_median(lst);
begin
  scalar n, med, diff_sum;
  n        := length(lst);  
  med      := median(lst);
  diff_sum := for i := 1:n sum abs(part(lst, i) - med);
  return diff_sum/n;
end;

on rounded;
precision 5;

mad_median({4,36,45,50,70 });
