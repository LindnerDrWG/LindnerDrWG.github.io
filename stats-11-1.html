## Statistics with Eigenmath  -  § 1.1-1
##            by Dr. W.G. Lindner  2026

"MEAN w.r.t. A"

------------------------------------ DEFINITION
mean(X)       = float( sum(X)/dim(X) )        

meanA(X,A)    = float( A + sum(X-A)/dim(X) )    
meanAF(X,f,A) = float( A + dot(f,(X-A))/sum(f)) 
------------------------------------------------
# meanF w.r.t. f & A


"EXAMPLE (Spiegel, p.74, P 3.19 )"
# grouped data with guessed mean A

# Calculate the arithmetic mean of the numbers 5,8,11,9,12,6,14,10
# choosing as the 'guessed mean' the number A=9.
# SOLUTION:

X = (5,8,11,9,12,6,14,10)
meanA(X,9)              -- with guessed mean A=9

# and with given frequency f
f = ( 5,18,42,27, 8)    -- freq
X = (61,64,67,70,73)    -- marks
meanAF(X,f,9)           -- with guessed mean A=9
"ok"
