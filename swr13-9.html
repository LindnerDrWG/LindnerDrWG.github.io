procedure XAPPLY(f,lst); lisp(f.cdr(lst))$
procedure SUM1(lst);     xapply(+, lst)$
procedure MEAN(lst);     xapply(+, lst)/length(lst)$
procedure DOT(A,B); 
          for i := 1:length(A) sum part(A,i)*part(B,i)$
procedure meanf(X,f); 
          dot(X,f)/Sum1(f)$

procedure sdF(X,f);
begin
  scalar n, muf, diff;
  n    := length(X);  
  if n = 0 then return 0;  
  muf  := meanf(X,f);
  diff := for i := 1:n collect (part(X, i) - muf)**2;
  return sqrt( dot(f, diff) / sum1(f));
end;

f :=  {5,18,42,27,8} $
X := {61,64,67,70,73}$

on rounded;
precision 5;

sdF(X,f);
