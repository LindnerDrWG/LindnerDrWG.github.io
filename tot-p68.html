# EIGENMATH

Eijk(i,j,k) = (j-i)*(k-i)*(k-j)/2           -- permutation symbol

cross1(M) = sum(i,1,3,  sum(j,1,3, Eijk(i,j, 1)*M[1,i]*M[2,j]))
cross2(M) = sum(i,1,3,  sum(j,1,3, Eijk(i,j, 2)*M[1,i]*M[2,j]))
cross3(M) = sum(i,1,3,  sum(j,1,3, Eijk(i,j, 3)*M[1,i]*M[2,j]))

cross(M) = (cross1(M), cross2(M), cross3(M))

A = ((1,2,3),(4,5,6))
cross(A)
