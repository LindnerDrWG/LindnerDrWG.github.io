--........................................................ tINV tCDF
  tCDF(x, df) = tdist(x, df)     
  tINV(x, df) = tdistinv(x, df)
  
  mean(X) = sum(X)/dim(X)
  sd(X)   = float( sqrt(sum((X-mean(X))^2) /(dim(X)-1)) )
  sd1(X)  = float( sqrt(mean(X^2) - mean(X)^2) )  

#############################################################
ttest(x, mu0, alpha, method) =
#################### method = "left","right","both" or -1,1,0
  do(print("   ______ One Sample t-test ______"),
     n    = dim(x),
     df   = n - 1,
     xbar = mean(x),
     s    = sd(x),

     # calculate test statistic T
     tstat = (xbar - mu0) / (s/sqrt(n)),

     # calculate critical value
     test( method == -1,                   # for left-tailed test
              do( critval = tINV(alpha, df), 
                  test(tstat < critval, print("left: reject H0"),  
                                        print("left: accept H0"))),
           method == 1,                    # for right-tailed test
              do( critval = tINV(alpha, df),
                  test(tstat > critval, print("right: reject H0"),  
                                        print("right: accept H0"))),
           method == 0,                    # for two-sided test
              do( critval = tINV(alpha/2, df), 
                  test( or( abs(tstat) >  abs(critval), 
                           -abs(tstat) < -abs(critval)), 
                        print("both: reject H0"), 
                        print("both: accept H0")))) ,
     M = zero(4,2),
     M[1,1] = "Significance level:",
     M[2,1] = "Degrees of freedom:",
     M[3,1] = "Test statistic:",
     M[4,1] = "Critical value:",
     M[1,2] = alpha,
     M[2,2] = df,
     M[3,2] = tstat, 
     M[4,2] = critval,
     M )
####################################################### ttest END

"------  EXAMPLE from statstutorial"

-- We do an example from the STATISTICS TUTORIAL
-- https://statstutorial.com/two-sample-z-test-in-r-with-examples/
-- to have a reference solution.

-- A random sample of screws have weights
--          29.99 ,30.01 ,29.97 ,30.11 ,29.99 ,30.02.
-- Calculate a 95% confidence interval for the population's mean 
-- weight.
-- Assume the population is distributed as N(μ, σ^2).

-- SOLUTION

X = (29.99 ,30.01 ,29.97 ,30.11 ,29.99 ,30.02)

n  = dim(X)
n

df = n-1
df

-------.......................................   some definitions
mean(X) = sum(X)/dim(X)
sd(X)   = sqrt(sum((X-mean(X))^2) /(dim(X)-1.)) 
-------..........................................................

xbar = mean(X)
xbar

s  = sd(X)
s

alpha = 0.05
alpha

t95 = tINV(1-alpha/2, df)         -- method "both sided"
t95                               -- t-quantile 95%

CI = ( xbar - t95*s/sqrt(n), xbar + t95*s/sqrt(n) )
CI
"ok"
-- RESULT
-- If we sampled many times, our interval would capture the true mean 
-- weight 95% of the time; thus, we are 95% confident that the true 
-- mean weight of all screws will fall between 29.96 and 30.07.

-- https://conjointly.com/kb/statistical-student-t-test/ >> picture

ttest(X, 30, 0.049^2, 0.05, 0)
