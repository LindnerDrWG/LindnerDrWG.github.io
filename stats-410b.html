## Statistics with Eigenmath       § 4.10.b
##            by Dr. W.G. Lindner  2026

"========================= WILCOXON one sample signed rank test"

"........... Prerequisites: sort, cRank, correspond, normCDF"
normCDF(L, mu,sigma) = 
                1/2 + 1/2*float(erf((L-mu)/(sqrt(2)*sigma)))

sort(v,i,k,n,t) = do( n = dim(v),         -- by G. Weigt 7/2025
     loop( test(n < 2, break), k = 1,
           for(i, 1, n - 1,
               test(v[i] > v[i + 1], 
                 do( t = v[i], v[i] = v[i + 1], v[i + 1] = t,
                     k = i ))), n = k), v)

cRank(W, i,j,k,n,t, Srank) = do(            -- by G. Weigt 8/25  
         j = 1, n = dim(W), Srank = 0,
         loop( test(j > n, break),
               k = j + 1,
               loop( test(k > n, break, W[j]==W[k], k=k+1, break)),
               t = 0.5*(j + k - 1),
               for(i, j, k-1, W[i] = t),
               t = k - j,
               Srank = Srank + t^3 - t,
               j = k), Srank,W)

correspond(X,sX, M) = do(   -- X and sortedX, by W. Lindner 7/25
    M=zero(dim(X)),
    for(j,1,dim(X),
    for(i,1,dim(X), test(sX[i]=X[j], M[j]=cRank(sX)[i]))), M)

".......... abstract the procedure to function signrank()"
-- i.e WILCOXON one sample signed rank test

##############################################################
  signrank(X,med, n,d,sd,md,cd,Z,ZR) = do(
##############################################################
     n    = dim(X),
     sign = zero(n),  sign = sgn(d),
     d    = zero(n),  d = X - med,
     md = mag(d),
     sd = sort(md),
     cd = correspond(md,sd),
     Z  = zero(n), for(i,1,n, test(d[i]>0, Z[i]=1)),
     W = dot(Z,cd),
     T = (W - n*(n+1)/4)/ sqrt(n*(n+1)*(2*n+1)/24),
     print(" _ Wilcoxon test _"), 
     (("W", "T"),(W,T)))
######################################################## END


-- check:
Y = (5.0, 3.9, 5.2, 5.5, 2.8, 6.1, 6.4, 2.6, 1.7, 4.3)
signrank(Y,3.7)
