procedure rms(lst);
begin
  scalar n, su, diff_sum;
  n        := length(lst);  
  su       := for i := 1:n sum part(lst, i)**2;  % mean
  return sqrt(su/n);
end;

on rounded $
precision 5$

X := {4,36,45,50,75}$
rms(X);
