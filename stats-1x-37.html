## Statistics with Eigenmath      § 1.10-38
##            by Dr. W.G. Lindner  2026

mean(X)       = float( sum(X)/dim(X) )    

------------------------------------------------------ 
moment(X,r)    = float( sum((X-mean(X))^r)/dim(X) ) -- .. about mean
moment0(X,r)   = float( sum(X^r) /dim(X) )          -- moment about 0
------------------------------------------------------ END

"Example"

-- EXAMPLE Spiegel, p.129, P 5.1 
-- Calculate the first, second, third and fourth moments of the
-- data set 2,3,7,8,10.
-- SOLUTION:

X=(2,3,7,8,10)

mean(X)
moment0(X,1)
moment0(X,2)
moment0(X,3)
moment0(X,4)
"ok"

-- Do P 5.2, default moment about the mean
moment(X,1)
moment(X,2)
moment(X,3)
moment(X,4)
"ok"
