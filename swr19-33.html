%-- We use the 'nearest-rank method' for calculating the quantile.

procedure quantile(X,p);
begin scalar Xs, i;
      if  p = 100 then return max(X);
      if  p = 0 then return min(X);
      load_package assist;
      dim(X) := length(X);
      Xs     := sortnumlist(X); 
      i      := ceiling(dim(X)*p/100);     %-- always round
      return part(Xs, i);
      % or  (part(Xs, i)+part(Xs, i))/2    %-- alternative
end;

X:={1};
% test
on rounded $
precision 5$

quantile(X, 42);
