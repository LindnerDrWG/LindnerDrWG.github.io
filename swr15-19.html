load_package assist;  % for sortnumlist
                    
procedure  median(X);
begin
  scalar  Xs,n2,n2p; % local vars
          Xs   := sortnumlist X; 
          n2   := floor(length(X)/2);  
          n2p  := n2+1;
          if evenp length(X) 
             then return  0.5*(part(Xs,n2)+part(Xs,n2p))
             else return  part(Xs,n2p); 
end;
        

COMMENT  ------------------------------------------------------------
madMed(X) = median(abs(X - median(X)))  -- med.abs.dev. w.r.t. median
---------------------------------------------------------------------;

procedure madMed(lst);
begin
  scalar n, med, Xbar;
  n        := length(lst);  
  med      := median(lst);
  Xbar     := for i := 1:n collect abs(part(lst, i) - med);
  return median(Xbar);
end;

on rounded;
precision 5;

X :={2,2,3,4,14};
madMed(X);
