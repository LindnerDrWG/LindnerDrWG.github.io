# EIGENMATH

g = ((1,0,0),(0,1,0),(0,0,1))
n = dim(g,1)                -- length(g)
sp(g,A,B) = sum(i,1,n, sum(j,1,n, g[i,j]*A[i]*B[j]))

A = (a1,a2,a3)              -- is column vector
B = (b1,b2,b3)
sp(g,A,B)
