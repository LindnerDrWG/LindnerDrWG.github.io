## Statistics with Eigenmath       § 3.1-119
##            by Dr. W.G. Lindner  2026
 
pi = float(pi)

"=============================== normINV - quantiles of normCDF"
   stdnormCDF(x) = 1/2*erfc(-x/sqrt(2))

   stdnormINV(x, a,b,k,t,y) = test(x=0, "-Inf", x=1, "+Inf",
                 and(0<x,x<1),
                  do( a = -10, b = 10,         -- x in [a,b]
                    for(k,1,100, 
                         t = (a+b)/2,
                         y = stdnormCDF(t),
                     test(abs(x-y)<0.0000001, break, y<x,a=t, b=t)
                    ), float(t) ))

   normINV(x,mu,sigma) = mu + sigma*stdnormINV(x)        -- (+)

-------------------------------------------------------------- END

"------  EXAMPLE: Quantile table, boxplot values"

-- Compute the inverse of cdf values evaluated at the probability 
-- values in p=0,0.25,0.5,0.75,1 for the normal distribution with 
-- mean=2 and standard deviation sigma=1.

P = (0,0.25,0.5,0.75,1)
X = (normINV(0, 2,1),    normINV(0.25, 2,1), normINV(0.5 ,2,1), 
     normINV(0.75, 2,1), normINV(1,2,1))
(P,X)   

-- MATLAB check
-- p = 0:0.25:1; mu = 2; sigma = 1;
-- x = norminv(p,mu,sigma)
-- x = 1×5
--    -Inf    1.3255    2.0000    2.6745     Inf
"ok"


"------ some Quantiles of normal CDF "

"                  some Quantile of normal/GAUSS distribution:"
X = ("X:", 0.9,0.95,0.975,0.99)
R = ("R:", 1.281552, 1.644854, 1.959964, 2.326348)  -- results R
(X,R)

"      p           stdNinv     R"
X = (0.9,0.95,0.975,0.99)
R = (1.281552, 1.644854, 1.959964, 2.326348)  -- results R
T = zero(3,4)     
for(i,1,4, T[1,i] = X[i])
for(i,1,4, T[2,i] = stdnormINV(X[i]))
for(i,1,4, T[3,i] = R[i])
transpose(T)
"ok"

"      p           normINV     R"
T = zero(3,4)     
for(i,1,4, T[1,i] = X[i])
for(i,1,4, T[2,i] = normINV(X[i],0,1))
for(i,1,4, T[3,i] = R[i])
transpose(T)
