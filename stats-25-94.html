"============================== poissonPDF - Poisson density"

          poissonPDF(L, k) = float(  L^k*1/k! * exp(-L)  )

--------- L = lambda ----------------------------------------

"a.  value table"

for(k,0,10, print(float(poissonPDF(4,k))) )

"b.  plot of Poisson(4,k)"
-- discrete points are plotted because of k!
f = poissonPDF(4, x)
xrange = (0,10)
yrange = (0,0.3)
draw(f,x)
