-- EXCURS alternativ definition of standard normal distribution
--        using build-in complementary error function 'erfc'

-------------------------------------- stdnormCDF.1 via erfc

    stdnormCDF1(x)       = 1/2*erfc(-x/sqrt(2))
    
    normCDF1(x,mu,sigma) = stdnormCDF1((x-mu)/sigma)

------------------------------------------------------------
-- https://de.mathworks.com/help/stats/normcdf.html
-- MatLab normcdf() uses the complementary error function erfc. 

"--- Example 1. ---"

stdnormCDF1( (185-173)/7 )
normCDF1(185,173,7)     
"ok"

"--- Example 2. ---"

-- construct a table for x = -2,-1,0,1,2
x = (-2,-1,0,1,2)
p = (normCDF1(-2,2,1), normCDF1(-1,2,1), normCDF1(0,2,1), 
     normCDF1( 1,2,1), normCDF1( 2,2,1))
(x,p)   
"ok"

-- CHECK
