    We show the steps. First we subtract 9 from each number in X, 
    then we add all these new numbers and shift them to the new center 9. 
    Then we abstract the procedure to function meanA ;


% 1st solution

procedure SUM1(lst); 
          for i := 1:length(lst) sum part(lst, i)$

procedure meanA(X,A);
begin
 scalar XA;
 XA := for i := 1:length(X) sum part(X, i)-A; 
 return XA/length(X);
end;

X := {5,8,11,9,12,6,14,10};
meanA(X,9);

% 2nd solution

procedure XAPPLY(f,lst); 
          lisp(f.cdr(lst))$
          
procedure MEAN(lst);     
          xapply(+, lst)/length(lst)$

A :=9;
XA := for i := 1:length(X) collect part(X, i)-A;
A+mean(XA);

on rounded;
A+mean(XA);
off rounded;
