pi = float(pi)

"=============================== normINV - quantiles of normCDF"
   stdnormCDF(x) = 1/2*erfc(-x/sqrt(2))

   stdnormINV(x, a,b,k,t,y) = test(x=0, "-Inf", x=1, "+Inf",
                 and(0<x,x<1),
                  do( a = -10, b = 10,         -- x in [a,b]
                    for(k,1,100, 
                         t = (a+b)/2,
                         y = stdnormCDF(t),
                     test(abs(x-y)<0.0000001, break, y<x,a=t, b=t)
                    ), float(t) ))

   normINV(x,mu,sigma) = mu + sigma*stdnormINV(x)        -- (+)

-------------------------------------------------------------- END


"------ EXAMPLE: 95% intervall"

-- Find an interval that contains 95% of the values from a standard 
-- normal distribution.
-- SOLUTION
                        
stdnormINV(0.025)       
stdnormINV(0.975)       
                        

-- CHECK
-- Matlab> x = norminv([0.025     0.975])
--         x = 1×2     -1.9600    1.9600
--                     Interval =[-1.96, 1.96] 
"ok"
