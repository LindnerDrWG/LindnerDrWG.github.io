-- DEFINITIONs FOR grad-div-curl IN SPECIAL COORDINATE SYSTEMS
--   scale factors h and Jacobian determinant Jac are integrated
--   If only Cartesian coordinates are involved,
--   you may also use the lowercase noted build-in
--   operators    grad, div, curl    instead of the user-defined
--   operators    Grad, Div, Curl

--========== operators grad div curl in R^3 in Cartesian coord's

I = (1,0,0)
J = (0,1,0)
K = (0,0,1)

Grad(f) = d(f,x)*I + d(f,y)*J + d(f,y)*K       -- i.e. \/f

Div(F) = d(F[1],x) + d(F[2],y) + d(F[3],z)     -- i.e. \/ . F

Curl(F) = (d(F[3],y)-d(F[2],z))*I + 
          (d(F[1],z)-d(F[3],x))*J +
          (d(F[2],x)-d(F[1],y))*K              -- i.e. \/ x f

Laplacian(f) = d(f,x,x) + d(f,y,y)+ d(f,z,z)   -- i.e. /\f

-- EXAMPLE
f(x,y,z) = x^2*y*z^3              -- f:R^3 --> R
F(x,y,z) = (x*z, -y^2, 2*x^2*y)   -- F:R^3 --> R^3
Grad(f)
Div(F)


--==========  operators grad div curl in R^3 in (C)ylindrical coord's

-- use X,Y,Z as symbolic basis for Er,Ephi,Ez
-- you MUST use the coordinate names (r, phi)

GradC(f) = d(f,r)*X + 1/r*d(f,phi)*Y + d(f,z)*Z       
  
DivC(F) = 1/r*d(r*F[1],r) + 1/r*d(F[2],phi) + d(F[3],z) 

CurlC(F) = (1/r*d(F[3],phi)-d(F[2],z))   *X + 
        (d(F[1],z)-d(F[3],r))         *Y +
        1/r*(d(r*F[2],r)-d(F[1],phi)) *Z   

LaplacianC(f) = 1/r*d(f,r)+d(f,r,r) + 1/r^2*d(f,phi,phi)+ d(f,z,z)   

-- EXAMPLE
f(r,phi,z) = r^2*z^3             -- f:R^3 --> R
F(r,phi,z) = (z,-phi^2,2*r^2*z)  -- F:R^3 --> R^3 
GradC(f)
DivC(F)

--==========  operators grad div curl in R^3 in (S)pherical coord's

-- use X,Y,Z as symbolic basis for Er, Etheta, Ephi
-- you MUST use the coordinate names (r, theta, phi)

GradS(f) = d(f,r)*Er + 1/r*d(f,theta)*Etheta + 
                    1/(r*sin(theta))*d(f,phi)*Ephi         

DivS(F) = 1/r^2*d(r^2*F[1],r) +
       1/(r*sin(theta))*d(sin(theta)*F[2],theta) + 
       1/(r*sin(theta))*d(F[3],phi) 

CurlS(F) = 1/(r*sin(theta))*( d(sin(theta)*F[3],theta)-d(F[2],phi))*Er + 
        1/r*( d(F[1],phi)/sin(theta) - d(r*F[3],r) )*Etheta +
        1/r*( d(r*F[2],r)-d(F[1],theta) )*Ephi 

LaplacianS(f) = 1/r^2*d(r^2*d(f,r),r) + 
             1/(r^2*sin(theta))*d(sin(theta)*d(f,theta),theta) + 
             1/(r^2*sin(theta)^2)*d(f,phi,phi)   

-- EXAMPLE
f(r,theta,phi) = 1/2*(2*cos(theta)+3*sin(theta)^2*cos(phi))
F(r,theta,phi) = (1, 2/theta, phi*r*sin(theta))
GradS(f)
DivS(F)

"---------- PROBLEM 2 ------------------------------------"
--  Find the unit normal vector to the surface    
--  f = x^2+y^2-z at point P(1,-2,5).               
----------------------------------------------------------

f = x^2+y^2-z
N = Grad(f)              -- grad points in normal direction
N

Np = eval(Grad(f), x,1, y,-2, z,5)    -- at point P(1,-2,5)
Np

UnitNormal = eval( N/abs(N), x,1, y,-2, z,5)
UnitNormal

"---------- PROBLEM 3 ------------------------------------"
-- Find the directional derivative of f=xyz at (1,1,1) 
-- in direction I+J+K.                          
----------------------------------------------------------

I = (1,0,0)
J = (0,1,0)
K = (0,0,1)
V = I+J+K        -- direction (1,1,1)
V

f(x,y,z) = x y z
f

P = (1,1,1)      -- point 

dD = dot( Grad(f), V/abs(V))   -- directional Derivative via V
dD

dDp = eval(dD, x,1, y,1, z,1)  -- .. at P
dDp

"---------- PROBLEM 7 ---------------------------------------"
-- Determine the constants a,b,c so, that the maximaum value
-- of the directional derivative of f=axy^2+byz+cz^2x^3 at (1,2,-1)
-- has a magnitude of 64 in the direction parallel to z-axis.
-------------------------------------------------------------

f(x,y,z) = a x y^2 + b y z + c z^2 x^3
P = (1,2,-1)      

Grad(f)

-- Dpf means directional.derivative of f at point P

Dpf = eval(Grad(f), x,1, y,2, z,-1) 
      -- maximum at P occurs in this direction 
Dpf

-- but dir.deriv. is maximal in direction of z axis,
-- i.e. Dpf must be parallel to (0,0,1); so:
-- (1)  4a+3c=0 & 
-- (2)  4a -b=0 
--      subtract (1)-(2):  3c+b=0  ==> 
-- (3)  b=-3c          
-- we should have: |\/f| = 64 ==> 2b-2c=64 ==> 
-- (4)  b-c=32
-- From (3) & (4) it follows: -4c=32 ==> c=-8
-- From (3): b=24
-- From (2): a=6 


"---------- PROBLEM 9 -------------------------------------"
-- Find the angle between the surfaces  x*log(z)=y^2-1 
-- and  x^2y=2-z  at the point (1,1,1).
-----------------------------------------------------------

-- The angle between surfaces in R^3 is the same as the
-- angle between their normal vectors.
-- Decribe the surfaces via the functions 

f = x*log(z)-y^2+1 
g = x^2y-2+z

-- We use  cos(phi)= grad(f)*grad(g)/(|grad(f)|.|grad(g)|)

A = eval(Grad(f), x,1, y,1, z,1)   -- value of grad(f) at (1,1,1)
B = eval(Grad(g), x,1, y,1, z,1)

phi = arccos( dot(A,B)/abs(A)/abs(B)) 
phi           -- unit rad
float

phi*180/pi    -- unit degree
float
