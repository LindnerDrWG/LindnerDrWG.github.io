   We use the well-known 'inner product' alias the 'dot'-product 
   of Linear Algebra to solve the problem using data structure list;

procedure xapply(f,lst); lisp(f.cdr(lst))$
procedure sum1(lst);     xapply(+, lst)$
procedure mean(lst);     xapply(+, lst)/length(lst)$

procedure DOT(A,B); 
          for i := 1:length(A) sum part(A,i)*part(B,i)$

f :=  {5,18,42,27,8} $
Sum1(f);

X := {61,64,67,70,73}$

on rounded;
dot(X,f)/Sum1(f);

procedure meanf(X,f); 
          dot(X,f)/Sum1(f)$
          
meanf(X,f);
