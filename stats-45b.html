"============================== Hypothesis Tests for two sample means"
--................................................. helper
  tCDF(x, df) = tdist(x, df)     
  tINV(x, df) = tdistinv(x, df)
  
  mean(X) = sum(X)/dim(X)
  sd(X)   = float( sqrt(sum((X-mean(X))^2) /(dim(X)-1)) )
  sd1(X)  = float( sqrt(mean(X^2) - mean(X)^2) )  
  min(a,b) = test(a<=b, a,b)
  max(v, i,m,n) = do( n = dim(v), m = v[1],    -- G. Weigt 19.7.2025
                    for(i, 2, n, test(v[i] > m, m = v[i])), m)
                    -- vectorizized maximum
  

"---  we abstract the procedure to Eigenmath functon tdiff()"

#############################################################
tdiff(X,Y,alpha, T,p,df,D,d,n) = do(
#############################################################
      print(" _____ paired t-test _____"),
      n  = dim(X),  -- = dim(Y)
      df = n-1,
      D  = X-Y,
      sum1 = sum(D),
      sum2 = dot(D,D),
      d  = sqrt((sum2-sum1^2/n)/(n*(n-1.))),
      T  = sum1/(n*d),
      pValue = min( 2*tCDF(T,df), 2*(1-tCDF(T,df)) ),
      test(pValue < 0.975, print("..... accept H0"), 
                           print("..... reject H0")),
      (("T:","p-value:"),(T,pValue)) )   

######################################################## END
