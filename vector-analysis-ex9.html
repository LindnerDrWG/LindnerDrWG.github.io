"========= FIRST: direct definition of grad-div-curl in polar coordinates"
-- X,Y are the basis vectors 

gradP(f) = d(f,r)*X + 1/r*d(f, phi)*Y

divP(F) = d(F[1],r) + F[1]/r + 1/r*d(F[2],phi)

curlP(F)=  ( 1/r*d(F[2],r) - 1/r*d(F[1],phi))*Z  
            -- musst be perpendicular to x,y direction
 
LaplacianP(f) = d(f,r,r) + 1/r*d(f,r) + 1/r^2*d(f, phi, phi)
--------------------------------------------------------------

"-- 1. EXAMPLE: calculate divPolar"

-- Consider a purely radial, position-dependent vector field 
-- (often representing a source, such as electric field or fluid
-- flow): F(r, theta) = r*{r}° 
-- Here, the radial component is F_r = r, and the angular component 
-- is F_theta = 0. 
-- Plugging these into the formula yields 1/r*(2r) = 2
-- Because the divergence is a constant 2, this means the field is 
-- expanding outward uniformly, creating a constant density of 
-- outward flux across space.

F(r, phi) = (r,0)
divP(F)

"-- 2. EXAMPLE from physicspages"

-- https://physicspages.com/pdf/Relativity/Divergence%20of%20vector%20field%20in%20polar%20coordinates.pdf

F = (x^2+3*y, y^2+3*x)

-- WARNING: build-in div(F) works only in R^3, so we overrite it

div(F) = d(F[1],x) + d(F[2],y)
div(F)

-- use polar coordinates

eval(div(F), x,r cos(phi), y,r sin(phi))
