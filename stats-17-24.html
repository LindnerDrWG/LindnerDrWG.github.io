"MEDIAN"

# .................................................
sort(v,i,k,n,t) = do( n = dim(v),       
     loop( test(n < 2, break), k = 1,
           for(i, 1, n - 1,
               test(v[i] > v[i + 1], 
                 do( t = v[i], v[i] = v[i + 1], v[i + 1] = t,
                     k = i ))), n = k), v)

---------------------------------------- DEFINITION
median(X, xmed,Xs,n2,n2p) = do(
          Xs   = sort(X),
          n2   = floor(dim(X)/2),  
          n2p  = n2+1,
          xmed = test( not(mod(dim(X),2)=0), Xs[n2p], 
                       0.5*(Xs[n2]+Xs[n2p])), float(xmed))
------------------------------------------- median 

"EXAMPLE"

median((36,4,75,45,50))    -- sorted: 4,36,45,50,70 -> 45
