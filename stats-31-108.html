##            by Dr. W.G. Lindner  2026
 
pi = float(pi)

"============================== normCDF - normal cumulative"

  normCDF(x, mu,sigma) = 
                  1/2 + 1/2*float(erf((x-mu)/(sqrt(2)*sigma)))

  stdnormCDF(x) = normCDF(x, 0,1)          -- standard normal CDF
  Phi(x)        = stdnormCDF(x)            -- classic notation

--------------------------------------------------------------

"-- EXAMPLE:"
 
-- A manufacturer fills sugar in packs, which have a distribution of 
-- N(1000,12^2). What percentage of the packs meet the printed 
-- minimum weight of 980 g?                   Cf. [4, p.50: 0.95221]

-- SOLUTION:  We have    PR(X>=980) = 1 - Pr(X<980) =

1 - normCDF(980, 1000, 12)
