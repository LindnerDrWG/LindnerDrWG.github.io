"=======================  LINEAR REGRESSION"

### --------------------------------------------------------------
###   regression : PEARSON's LINEAR REGRESSION LINE 
###                for linear relation between X and Y, X ~lin Y
### --------------------------------------------------------------
    mean(X)       = float( sum(X)/dim(X) )  

    regression(X,Y,   mX,mY,sX,sY,sXY,a,b) = 
                    do( 
                      n   = dim(X),
                      mX  = mean(X),
                      mY  = mean(Y), 
                      sX  = sum((X-mX)^2),
                      sXY = sum((X-mX)*(Y-mY)),
                      a   = sXY/sX,                
                      b   = 1/n*(sum(Y)-a*sum(X)),
                      print(" _____  y = a*x + b  ____"),
                      (("a","b"), (a,b)))

    lm(X,Y) = regression(X,Y)
------------------------------------------------------ END

"------ EXAMPLE Spiegel p.361, P 14.12"

-- Is there a connection between grade point average (GPA) and hours
-- of TV watched per week. There is a sample of 10 hight school studs:

TVhours = (20,5,8,10,13,7,13,5,25,14)
GPA     = (2.35, 3.8, 3.5, 2.75, 3.25, 3.4, 2.9, 3.5, 2.25, 2.75)

-- SOLUTION:

lm(TVhours, GPA)
"ok"

-- RESULT: The variable TVhours and GPA are negativly correlated.
-- i.e. as more hours of TV are watched, the lower is the GPA ;(
