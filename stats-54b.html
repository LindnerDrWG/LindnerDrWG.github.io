## Statistics with Eigenmath       § 5.4.b
##            by Dr. W.G. Lindner  2026

-- In this script we demonstrate the determination of the
-- Intraclass correlation coefficient ICC in three phases:

-- SECONDLY we calculate ICC fully automatic 


### ----------------------   ICC   -------------------------
###     icc(X,Y)
###     method = Single Score Oneway Intraclass Correlation
###              with k = 2 cases (fix)
### ........................................................

icc(X,Y,  Z,T,S,n) = do( 
          k = 2,
          n = dim(X),
          T = zero(dim(X)),
          Z = (X,Y),
          S = sum(Z),
          for(i,1,n, T[i]= X[i]+Y[i]),
          SAQt = sum(Z^2) - S^2/(k*n),  -- total
          SAQr = 1/k * sum(j,1,n, T[j]^2) - S^2/(k*n), -- row
          dfr= n-1,
          MQr = SAQr/dfr,
          SAQb = SAQt - SAQr,      -- b : between
          dfb= n*(k-1),
          MQb = SAQb / dfb,
          ICC = (MQr -MQb)/(MQr + (k-1)*MQb),
          float(ICC) )
-------------------------------------------------------- END

"================ EXAMPLE: women asked about their weight"

-- EXAMPLE (Zoefel, [6, p. 133 ff])
-- Fourteen women were asked about their weight; the given answers X
-- were then compared to the actual measured weight Y:

X=(48,48,50,50,52,58,63,56,48,63,58,58,52,60)
Y=(51,50,50,52,53,63,70,70,49,63,59,58,56,62)
icc(X,Y)
