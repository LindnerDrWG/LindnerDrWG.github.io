procedure SD(lst);
begin
  scalar n, mu, diff_sum;
  n := length(lst);  
  if n = 0 then return 0;  
  mu := for i := 1:n sum (part(lst, i)/n);
  diff_sum := for i := 1:n sum (part(lst, i) - mu)**2;
  return sqrt(diff_sum/n);
end;

procedure SD1(lst);
begin
  scalar n, mu, diff_sum;
  n := length(lst);
  if n = 0 then return 0;  
  mu := for i := 1:length(lst) sum (part(lst, i)/n);
  diff_sum := for i := 1:n sum (part(lst, i) - mu)**2;
  return sqrt(diff_sum / (n-1));
end;
