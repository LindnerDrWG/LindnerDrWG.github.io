procedure SUM1(X); 
          for i := 1:length(X) sum part(X, i)$
          
procedure mean(X); 
          Sum1(X)/length(X)$

procedure moment(X,r);
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx := for i := 1:n sum (part(X, i) - mx)^r;
  return sx/n;
end;

procedure kurtosis(X);
          moment(X,4)/moment(X,2)^2;   %---  MatLab's
    
on rounded $
precision 5 $

X := {4,36,45,50,75};
kurtosis(X);         % = 2.347 or 1.9129
