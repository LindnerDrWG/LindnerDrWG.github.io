procedure VAR(lst);
begin
  scalar n, mu, diff_sum;
  n := length(lst);  
  if n = 0 then return 0;  
  mu := for i := 1:n sum (part(lst, i)/n);  % mean
  % Calculate sum of squared differences w.r.t. the mean
  diff_sum := for i := 1:n sum (part(lst, i) - mu)**2;
  % Return population variance
  return diff_sum/n;
end;

procedure VAR1(lst);
begin
  scalar n, mu, diff_sum;
  n := length(lst);
  if n = 0 then return 0;  
  mu := for i := 1:length(lst) sum (part(lst, i)/n);
  % Calculate sum of squared differences
  diff_sum := for i := 1:n sum (part(lst, i) - mu)**2;
  % Return sample variance
  return diff_sum / (n-1);
end;
