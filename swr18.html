% function MODE is explained in exercise 27

procedure MODE(X);
begin scalar maxx, L;
      load_package assist;
      L := frequency(X);
      maxx:=first(L);
      for i:=1:length(L) do 
          if part(part(L,i),2) > part(maxx,2) 
          then maxx:=part(L,i);
      return part(maxx,1);
end;
