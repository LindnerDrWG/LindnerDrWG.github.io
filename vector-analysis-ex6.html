##| VectorCalculus : cylindrical coordinates, problem 4
##| https://lindnerdrwg.github.io/VectorCalculus-with-Eigenmath.pdf
##|         by Dr. W.G. Lindner, Leichlingen DE, 2026

"DEFINITIONS for curvilinear coordinates:"
-- u : coordinates
-- f : scalar function
-- F : vector function
-- h : scale factors
-- Jac : Jacobi matrix
-----------------------------------------------------------------

F = (f1(),f2(),f3())

Grad(f) = ( d(f,u[1])/h[1], d(f,u[2])/h[2], d(f,u[3])/h[3] ) 

Div(F) = 1/Jac * ( d(Jac F[1]/h[1],u[1]) +
                   d(Jac F[2]/h[2],u[2]) + 
                   d(Jac F[3]/h[3],u[3]))

Curl(F)= 1/Jac *(h[1]*(d(h[3]*F[3],u[2]) - d(h[2]*F[2],u[3])),
                 h[2]*(d(h[1]*F[1],u[3]) - d(h[3]*F[3],u[1])),
                 h[3]*(d(h[2]*F[2],u[1]) - d(h[1]*F[1],u[2])))

Laplacian(f)= 1/Jac *( d(h[2]*h[3]/h[1]*d(f,u[1]),u[1]) + 
                       d(h[3]*h[1]/h[2]*d(f,u[2]),u[2]) +
                       d(h[1]*h[2]/h[3]*d(f,u[3]),u[3]) )

-----------------------------------------------------------------

"specialization: cylindrical coords are (r,phi,z):"

u = (r,phi,z)
u

R = (r cos(phi), r sin(phi), z) -- position vector of a point
R                          

"tangent vectors to r, phi, z lines at position R:"
Ur = d(R,u[1])
Ur

Uphi = d(R,u[2])
Uphi

Uz = d(R,u[3])
Uz

Urphiz =  d(R,u)      
Urphiz

U = transpose(d(R,u))    -- tangent vectors collected as columns
U

"scale factors:"
h(i) = sqrt(dot(U[i], U[i]))
h    = (simplify(h(1)), simplify(h(2)), simplify(h(3)) )
h

"Jacobian:"
Jac = h[1]* h[2]* h[3]       -- from theory
Jac = simplify(Jac)
Jac

Jac = simplify(det(U))       -- alternative from definition
Jac 

"unit vectors in these directions:"

er   = Ur/h[1]               -- =  cos(phi)*I + sin(phi)*J.  (1)
er
ephi = Uphi/h[2]             -- = -sin(phi)*I + cos(phi)*J.  (2)
ephi
ez   = Uz/h[3]
ez

"Grad, Div, Curl, Laplace in cylindrical coordinates"

"Gradient:"
Grad(f(r,phi,z))

"Divergence:"
F(r,phi,z)=(f1(r,phi,z),f2(r,phi,z),f3(r,phi,z))
Div(F(r,phi,z))

"Curl:"
Curl(F(r,phi,z))

"Laplacian:"
Laplacian(f(r,phi,z))

"--------- SOLUTION to 4 --------- :"

F(x,y,z) = (z,-2x,y)      -- = z*I - 2*x*J + y*K  cartesian
                          -- I=(1,0,0) ..

-- Position is the same in both coordinate systems
-- i.e.     R = xI+yJ+zK = r*Er + s*Ephi + t*Ez
-- Goal: write F as (..)*Er + (..)*Ephi + (..)*Ez
-- we know by (1) and (2):
--
--    Er   =  cos(phi)*I + sin(phi)*J with I=e1 and J=e2
--    Ep   = -sin(phi)*I + cos(phi)*J
--
-- 1. solve via Xmaxima or by hand for I and J: 
--    solve([cos(p)*I+sin(p)*J=Er, -sin(p)*I+cos(p)*J=Ep], [I,J]);
--    to get:
--    I = - Ep*sin(phi)+Er*cos(phi)               (3)
--    J =   Er*sin(phi)+Ep*cos(phi)               (4)
--    now start replacing I,J with (3),(4):
--    F(x,y,z) = (z,-2x,y) = z* I - 2*x* J + y* z = ..
--
-- 2. solve for I,J by inverting the transformation matrix M:

M = ((cos(phi),sin(phi)),(-sin(phi),cos(phi)))
M                    -- transformation matrix from position R
inv(M)
invM = simplify(inv(M))
invM

I = dot(invM[1], (Er,Ep))
I
J = dot(invM[2], (Er,Ep))
J

-- Now we have
-- F(x,y,z)= (z,-2x,y) = z*I - 2*x*J         + y*z 
--                               x=(r*cos(phi) y= r*sin(phi)
F(r,phi,z) = z*I -2*(r*cos(phi))*J + (r*sin(phi))*z
F(r,phi,z)

F(r,phi,z) =  z*(-Ep*sin(phi)+Er*cos(phi))       -
              2*r*cos(phi)*(Er*sin(p)+Ep*cos(p)) +
              r*sin(phi)*Ez                   -- = zI-2yJ+yK 
F
-- read off the coordinates to get F(r,phi,z) as function to R^3
-- to use the general formula's for F:R^3-->R^3 above,
-- which works without the unit vectors using coordinates only
F(r,phi,z) = (-2 r cos(phi) sin(phi) + z cos(phi), 
              -2 r cos(phi) sin(phi) -z sin(phi), 
              r sin(phi))
F
-- now we are ready to use the formula for Curl:

"Divergence:"
Div(F)
simplify( Div(F) )


"Curl:"
Curl(F(r,phi,z))
simplify( Curl(F) )
