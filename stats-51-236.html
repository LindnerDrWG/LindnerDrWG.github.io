## Statistics with Eigenmath       § 5.1-236
##            by Dr. W.G. Lindner  2026

"========================= Pearson's rho Correlation coefficient "

"........... Prerequisites: mean"

mean(X) = float( sum(X)/dim(X) )  


".......... DEFINITION (CORRELATION Coefficient rho alias r)"
###########################################################
corrcoef(X,Y,  numer,denom, Xm,Ym) = 
                 do( numer = 0,
                     Xm = X - mean(X),
                     Ym = Y - mean(Y), -- variant of sumprod:
                     for(i,1,dim(X), numer = numer + Xm[i]*Ym[i]),
                     denom = sqrt( sum(Xm^2) * sum(Ym^2)),
                     numer / denom)

r(x,Y) = corrcoef(X,Y)
####################################################### END

".......... EXAMPLE check"

X=(1,3,4,6,8,9,11,14)
Y=(1,2,4,4,5,7,8,9)
corrcoef(X,Y)

"ok - 0.977"
