## Statistics with Eigenmath       § 3.1-107
##            by Dr. W.G. Lindner  2026
 
pi = float(pi)

"============================== normCDF - normal cumulative"

  normCDF(x, mu,sigma) = 
                  1/2 + 1/2*float(erf((x-mu)/(sqrt(2)*sigma)))

  stdnormCDF(x) = normCDF(x, 0,1)      -- standard normal CDF
  Phi(x)        = stdnormCDF(x)        -- classic notation

--------------------------------------------------------------

"construct a table for normCDF for x = -2,-1,0,1,2"

X = (-2,-1,0,1,2)
p = (normCDF(-2,2,1), normCDF(-1,2,1), normCDF(0,2,1), 
     normCDF( 1,2,1), normCDF( 2,2,1))
(X,p)   
"ok"
