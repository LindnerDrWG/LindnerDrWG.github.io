"============================== helper functions"
  
  Beta(a,b) = test( or(a<=0, b<=0), -1,
                     exp( lgamma(a)+lgamma(b)-lgamma(a+b)) )

  fPDF(x,f1,f2) = float( sqrt(((f1*x)^f1*f2^f2)/(f1*x+f2)^(f1+f2)) /
                         (x*Beta(f1/2,f2/2)) )
                         
  fCDF(t,df1,df2)  = incbeta(t/(t+df2/df1), 0.5 df1, 0.5 df2)
