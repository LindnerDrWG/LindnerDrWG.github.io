"============================== normCDF - normal cumulative"

  normCDF(x, mu,sigma) = 
                  1/2 + 1/2*float(erf((x-mu)/(sqrt(2)*sigma)))

  stdnormCDF(x) = normCDF(x, 0,1)          -- standard normal CDF
  Phi(x)        = stdnormCDF(x)            -- classic notation

--------------------------------------------------------------

"------ EXAMPLE: men's height"

-- When measuring men, the mean height was 1.73 cm with a spread 
-- of 7 cm. Men between the heights of 166 cm and 180 cm are therefore 
-- considered to be of 'normal' height. 
-- What is the probability that a man is shorter than 1.85 m 
-- according to this distribution?    Cf.[4,p.50,Ex.4.1: 0.95741 ??]

-- SOLUTION: P(X<185) =

normCDF(185,173,7)   
# or
Phi( (185-173)/7 )
