# EIGENMATH
-- tangent vectors on a sphere

R(theta,phi) = (cos(theta)*cos(phi), cos(theta)*sin(phi),  sin(theta))

Z1 = d( R(theta,phi), theta)
Z1
Z2 = d( R(theta,phi), phi)
Z2
eval(Z1, theta,pi/4, phi,0)
eval(Z2, theta,pi/4, phi,0)
