procedure SUM1(X); 
          for i := 1:length(X) sum part(X, i)$
          
procedure mean(X); 
          Sum1(X)/length(X)$

procedure moment(X,r);
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx  := for i := 1:n sum (part(X, i) - mx)^r;
  return sx/n;
end;

procedure skew(X);
    moment(X,3)/ sqrt(moment(X,2)^3); %--- MatLab
    
on rounded $
precision 5 $

X:={5,10,15,20,30,50,80,150,300,500}$

skew(X);  % = 1.5598
