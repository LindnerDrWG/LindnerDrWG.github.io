## Statistics with Eigenmath       § 5.2-241
##            by Dr. W.G. Lindner  2026

"========================= SPEARMAN rank correlation rho "

"........... Prerequisites: sort, cRank, spearman"

mean(X)   = float( sum(X)/dim(X) )  
cov(X,Y)  = 1/dim(X) * sum( (X-mean(X)) * (Y-mean(Y)) )
sd0(X)    = sqrt( sum((X-mean(X))^2) /dim(X) )

sort(v,i,k,n,t) = do( n = dim(v),      
     loop( test(n < 2, break), k = 1,
           for(i, 1, n - 1,
               test(v[i] > v[i + 1], 
                 do( t = v[i], v[i] = v[i + 1], v[i + 1] = t,
                     k = i ))), n = k), v)

cRank(W, i,j,k,n,t, Srank) = do(          -- by G. Weigt 8/25  
         j = 1, n = dim(W), Srank = 0,
         loop( test(j > n, break),
               k = j + 1,
               loop( test(k > n, break, W[j]==W[k], k=k+1, break)),
               t = 0.5*(j + k - 1),
               for(i, j, k-1, W[i] = t),
               t = k - j, Srank = Srank + t^3 - t, j = k), W)

correspond(X,sX, M) = do( M=zero(dim(X)),
           for(j,1,dim(X),
           for(i,1,dim(X), test(sX[i]=X[j], M[j]=cRank(sX)[i]))), M)

spearman(X,Y) = do(
                n  = dim(X),
                sX = sort(X),  sY = sort(Y),
                rX = Rank(sX), rY = cRank(sY),
                cX = correspond(X, sX), cY = correspond(Y, sY),
                rhoS = cov(cX,cY)/(sd0(cX)*sd0(cY)),
                rhoS)           
## ----------------------------------------------------------- END
