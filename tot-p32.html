# EIGENMATH
-- we introduce polar coordinates in R^2 by
R(r,theta) = (r cos(theta),r sin(theta))

-- the covariant basis in cylindrical coordinates
Z1 = d(R(r, theta), r)
Z2 = d(R(r, theta), theta)
Z  = (Z1,Z2)
Z             -- Z is also transpose(d(R(r, theta), (r, theta)))

-- metric tensor in polar coordinates
gdd = zero(2,2)
      for(i,1,2,
         for(j,1,2, gdd[i,j]= dot(Z[i],Z[j]) ))  -- Z[1] is 1st row of Z, ie. Z1
gdd
gdd = simplify(gdd)

-- Calculate guu, i.e. the inverse of gij
guu = inv(gdd)
guu

-- calculate contravariant basis
uZ1 = guu[1,1]*Z1 + guu[1,2]*Z2
uZ1
uZ2 = guu[2,1]*Z1 + guu[2,2]*Z2
uZ2
--* or do */
uZ1 = dot( guu[1] , Z)
uZ1
uZ2 = dot( guu[2] , Z)
uZ2
