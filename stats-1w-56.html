## Statistics with Eigenmath      § 1.13-56
##            by Dr. W.G. Lindner  2026

"Covariance"

mean(X)       = float( sum(X)/dim(X) )  
------------------------------------------------------ cov

  cov(X,Y)  = 1/dim(X)     * sum( (X-mean(X)) * (Y-mean(Y)) )

  covR(X,Y) = 1/(dim(X)-1) * sum( (X-mean(X)) * (Y-mean(Y)) )
                                   -- R method 'pearson'
----------------------------------------------------- END

"--- 56. ---"

cov( (2,3,4,3), (2,3,4,3) )

covR( (2,3,4,3), (2,3,4,3) )

cov( (1,2,3,4), (4,3,2,1) )
