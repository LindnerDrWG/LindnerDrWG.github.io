"mean absolute deviation - mad"

mean(X) = float( sum(X)/dim(X) )          

-------------------------------------  DEFINITION
mad(X)  = mean(mag(X - mean(X)))            
-------------------------------------  mad, m.abs.dev.

"EXAMPLE, wiki ibid."
"
-- For example, for the data set {2, 2, 3, 4, 14} the MAD is

set = (2, 2, 3, 4, 14)
mad(set)                     -- mean absolute deviation
