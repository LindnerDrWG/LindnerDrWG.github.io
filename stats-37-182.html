## Statistics with Eigenmath       § 3.7-182
##            by Dr. W.G. Lindner  2026


"========================= weibullxxx"

  weibullPDF(x,a,b) = test( x<0, 0, 
                      float( b/a*(x/a)^(b-1)*exp(-(x/a)^b) ))

  weibullCDF(x,a,b) =  1 - exp(-(x/a)^b)        -- for x>0


  weibullINV(p,a,b) = abs( -a * ( log(1-p) )^(1/b) )

-------------------------------------------------------------------

"------  EXERCISE (Beucher)"

-- cf. Beucher[1], warning: (a,b) = (b,T)
-- Translate the following MatLAB/Octave snippet in EIGENMATH!

stop 

x=(0:1:10);               % Wertebereich von x:  0,1,10
b = 0.444;  T=0.767;      % Parameter der Weibull-Verteilung
a = 1/(T^b);              % Anpassung der Parameter auf MATLAB 
                          % Berechnung Weibull-Verteilungsdichte
pdfwb = wblpdf(x, a, b)

pdfwb =
