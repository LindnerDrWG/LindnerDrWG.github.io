procedure dsquare(lst);
begin
  scalar n, mu, Xbar;
  n        := length(lst);  
  mu       := for i := 1:n sum part(lst, i)/n;  % mean
  Xbar     := for i := 1:n sum (part(lst, i) - mu)**2;
  return Xbar/n;
end;

on rounded;
precision 5;

X :={4,36,45,50,75};
dsquare(X);
