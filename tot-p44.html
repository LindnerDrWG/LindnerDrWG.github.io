# EIGENMATH

f(x,y) = x^2-2*x*y+5*y^2+3*x-2*y+3

"grad of f in Cartesian coords"
E = (x, y)     -- Cartesian coordinates

gradf(x,y) = d(f, E)
gradf
-- or: gradf1(x,y) =  (d(f(x,y),E[1]) , d(f(x,y),E[2]))

"grad of f in polar coords"
U = (r, theta)           -- polar coords:  r, theta

f1(r,theta) = eval(f(x,y), x, r*cos(theta), y, r*sin(theta))
f1 

gradf1(r,theta) = d( f1(r,theta), U)
gradf1
gradf1 = simplify(gradf1)
gradf1

"Jacobian  of coord transformations in both coords"
toPolar(x,y) = (sqrt(x^2+y^2), arctan(y,x))

J1 = d(toPolar, E)  
J1
J1 = simplify(J1)    
J1

toCartesic(r,theta) = (r*cos(theta), r*sin(theta))

J2 = d(toCartesic, U)
J2

"proving that J1 and J2 are inverses"

J1J2 = dot(J1, J2)
J1J2

J1J2 = eval(dot(J1, J2), 
            sin(theta),    y/r,      -- substitutions
            cos(theta),    x/r, 
            sqrt(x^2+y^2), r)
J1J2

"Verify: J1J2[1,1] = 1 and J1J2[2,2] = 1"

a11 = x^2/r^2 + y^2/r^2     -- we know: x^2+y^2 = r^2.  (3)
a11
a11 = (x^2+y^2)/r^2
a11
a11 = r^2/r^2 
a11

a22 = y^2/(x^2*(y^2/x^2+1)) + 1/(y^2/x^2+1) -- element (2,2)
a22
a22 = y^2/(x^2*((y^2+x^2)/x^2)) + 1/(y^2/x^2+1)
a22
a22 = y^2/(x^2*((y^2+x^2)/x^2)) + 1/((y^2+x^2)/x^2)
a22
a22 = (x^2+y^2)/(x^2+y^2)
a22 

"ergo:"
J1J2 = unit(2)
J1J2
