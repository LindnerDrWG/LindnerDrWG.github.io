"KURTOSIS"


"EXAMPLE (Spiegel, p.135, P 5.13)"

X=(61,64,67,70,73)    -- marks
f=( 5,18,42,27, 8)    -- freq

-- we adapt the kurtosis to median and frequency of the group
-------------------------------------------------------------
meanF(X,f)      = float( dot(f,X)/sum(f) )    
momentMF(X,f,r) = float( dot( f, (X-meanF(X,f))^r)/sum(f) ) 
kurtosisMF(X,f) = momentMF(X,f,4)/momentMF(X,f,2)^2 
-------------------------------------------------------------

kurtosisMF(X,f)       
"ok"


"EXAMPLE (Spiegel: p.138, P 5.39; gives 2.62)"

X = (12,14,16,18,20,22)
f = ( 1, 4, 6,10, 7, 2)
kurtosisMF(X,f)       
"approx. ok" 



"EXAMPLE (Spiegel p.130 P 5.44)"

X=(10,20,30,40,50,60,70,80,90)    -- marks
f=(1,2,3,4,30,4,3,2,1)            -- freq

meanF(X,f)      = float( dot(f,X)/sum(f) )                 
momentMF(X,f,r) = float( dot( f, (X-meanF(X,f))^r)/sum(f) ) 
kurtosisMF(X,f)       
"ok"


"ANOTHER example"
-------------------------------------------------------------
mean(X)     = float( sum(X)/dim(X) )          
sd(X)       = float( sqrt(sum((X-mean(X))^2) /(dim(X)-1)) ) 
moment(X,r) = float( sum((X-mean(X))^r)/dim(X) )

kurtosis(X)   = moment(X,4)/moment(X,2)^2
kurtosisM(X)  = moment(X,4)/sd(X)^4   
kurtosis1(X)  = float(dim(X)* sum((X-mean(X))^4) / 
                                sum((X-mean(X))^2)^2 )
kurtosis0(X,n) = do( n=dim(X),   
                 test( n<4 , "n must be >=4",
                 (n-1)/((n-2)*(n-3))*((n+1)*kurtosis(X) -3*(n-1))+3 ))          
kurtosisR1(X) = moment(X,4)/moment(X,2)^2 - 3        

kurtosisR2(X) = do( n=dim(X),         
                     ((n+1)*kurtosisR1(X)+6)*(n-1)/((n-2)*(n-3)) )  
kurtosisR3(X) = moment(X,4)/moment(X,2)^2 *(1 - 1/dim(X))^2 - 3 
-------------------------------------------------------------


X=(2,5,12,17,14,6,3,1)

kurtosis(X)      --  1.673   moment def, matlab flag 0
kurtosis0(X)     --  1.613   Matlab's flag=0
kurtosis1(X)     --  1.673   kurtosis (org.def.)
kurtosisR3(X)    -- -1.7188  R:e1071 Typ 3
