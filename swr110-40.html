COMMENT
           STATISTICS WITH REDUCE ch. 1.10-40
                      Dr. W.G. Lindner
                      Leichlingen, Germany 2026
;                     
                      
procedure SUM1(X); 
          for i := 1:length(X) sum part(X, i)$

procedure DOT(A,B); 
          for i := 1:length(A) sum part(A,i)*part(B,i)$
          
procedure meanF(X,f); 
          dot(X,f)/Sum1(f)$

procedure momentF(X,f,r);
begin
  scalar n, mf, diff;
  n    := length(X);  
  % ok ;) if n = 0 then return 0;  
  mf   := meanF(X,f);
  diff := for i:=1:n collect (part(X, i) - mf)**r;
  return dot(f, diff) / sum1(f);
end;

on rounded $
precision 5 $

X := {12,14,16,18,20,22};
f := {1,4,6,10,7,2};

momentF(X,f,2);
