"STANDARD ERROR of MEAN"

--          helper functions
mean(X) = float( sum(X)/dim(X) )                -- population mean
sd(X)   = sqrt(sum((X-mean(X))^2) /(dim(X)-1))  -- sample sd


-------------------------------------DEFINITION
   sem(X) = sd(X)/sqrt(dim(X))                  
-----------------------------------------------

sem((1,2,3,4))
"ok"
