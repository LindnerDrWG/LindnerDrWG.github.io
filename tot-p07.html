<script src="https://georgeweigt.github.io/eigenmath.js"></script>
<table><tr><td>
<textarea id="stdin" rows="24" cols="80" style="font-family:courier;font-size:12pt">

# EIGENMATH

e1 = (1, 0)
e2 = (0, 1)
C  = (x, y)                                    -- 1 */

-- other basis vectors b1, b2
b1 = a11*e1 + a21*e2
b2 = a12*e1 + a22*e2  

-- ansatz for same point C(x,y) w.r.t. e and b 
-- x*e1 + y*e2 = u*b1 + v*b2;                 -- 2 */

-- read coordinates of C w.r.t. basis b
x = a11*u + a12*v
y = a21*u + a22*v

-- collect new coordinates of C as columns(!) in a matrix A
-- i.e. A is transpose of (b1,b2)

A = ((a11, a12), (a21, a22))

AU = dot( A, (u,v))              -- means matrix product A*U
AU

-- kill content of x and y
x=quote(x)
y=quote(y)

-- (x,y) = A . (u,v)                         -- 3 */
--     X = A . U      => U = inverse(A) . X 
U = dot(inv(A) , (x,y))                      -- 4 */
U

</textarea>
</td><td>
<button onclick="run()" style="font-size:20pt">Run</button>
</td></tr></table>

</body>
