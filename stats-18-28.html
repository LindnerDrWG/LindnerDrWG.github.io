## Statistics with Eigenmath      § 1.8-28
##            by Dr. W.G. Lindner  2026


"MODE"

--------------------------------------------- mode
  mode(v, i,j,k,m,n) =      --  by G. Weigt 8/2025
    do( n = 0,
      for(i,1,dim(v),
          k = 0,
          for(j,1,dim(v), test(v[i] == v[j], k = k + 1)),
          test(or(k > n, and(k == n, v[i] < m)), 
               do(n = k, m = v[i]))),  m )
--------------------------------------------- 


X = (0,2,2,1,4)
mode(X)
