procedure SUM1(X); 
          for i := 1:length(X) sum part(X, i)$
          
procedure mean(X); 
          Sum1(X)/length(X)$

procedure sd(X);
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx := for i := 1:n sum (part(X, i) - mx)^2;
  return sqrt(sx)/(n-1);
end;
%  == sqrt(Sum((X-Mean(X))^2) /(length(X)-1))

procedure moment(X,r);
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx := for i := 1:n sum (part(X, i) - mx)^r;
  return sx/n;
end;

procedure skew(X);
          moment(X,3)/ sqrt(moment(X,2)^3);   %--- MatLab's
    
    
procedure skewR(X);                     %--- R, default 
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx  := for i := 1:n sum (part(X, i) - mx)^3;
  return sx/((n-1)*sd(X)^3);
end;
% == Sum((X-Mean(X))^3)/ ((length(X)-1)*sd(X)^3)   
  
  
procedure skew1(X);                     %---R, type=3
begin
  scalar n, mx, sx;
  n   := length(X);  
  mx  := mean(X);
  sx  := for i := 1:n sum ( (part(X, i) - mx) / sd(X))^3;
  return sx/n;
end;
% := 1/length(X) * Sum( ( (X - Mean(X)) / sd(X))^3  )  


procedure skew2(X);                     %---- R, type=2 
begin
  scalar n, mx, sx;
  n   := length(X);  
  return sqrt(n*(n-1))/(n-2)*skew(X) ;
end;
%  block([n: length(X)], sqrt(n*(n-1))/(n-2)*skew(X) )) 


on rounded $
precision 5 $

X := {4, 36, 45, 50, 75}$ 

skew(X);    %  = -0.306  [MatLAB] 

skewR(X);   %  = -0.274  [R, default] 

skew1(X);   %  = -0.219  [R, type=3] 

skew2(X);   %  = -0.456 [R, type=2]
