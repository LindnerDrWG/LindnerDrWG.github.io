# EIGENMATH

Theta = ((8,2,0),(2,8,0),(0,0,4))
Theta
Ev = eigenvec(Theta )
Ev
ev = dot( transpose(Ev), Theta, Ev)
-- eigenvalues on diagonal of EV
ev

--* b.:  the eigenvectors of Theta
v1 = (1, -1,  0)
v2 = (1,  1,  0)
v3 = (0,  0,  1)

--* Check if Theta . v_i = lambda_i * v_i 
dot(Theta , v1)        
dot(Theta , v2)
dot(Theta , v3)

unitvector(v) = v/abs(v)  -- abs: vector length of v

v1u = unitvector(v1)
v2u = unitvector(v2)
v3u = unitvector(v3)

--* c.:  A is matrix of normed eigenvectors as columns
A = transpose( (v1u,v2u,v3u) )

--*     calculate the new coordinates U via 
--*     X = A . U => U = inverse(A) . X 

dot( inv(A), ( 1,-1,-1))
dot( inv(A), (-1, 1,-1))
dot( inv(A), ( 0, 0, 2))

dot(Theta , A)

"d.:  verify tensor property of Theta"
dot(inv(A) , Theta , A)
