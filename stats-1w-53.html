## Statistics with Eigenmath      § 1.13-53
##            by Dr. W.G. Lindner  2026

"Covariance"

mean(X)       = float( sum(X)/dim(X) )  

------------------------------------------------------ cov

  cov(X,Y)  = 1/dim(X)     * sum( (X-mean(X)) * (Y-mean(Y)) )

  covR(X,Y) = 1/(dim(X)-1) * sum( (X-mean(X)) * (Y-mean(Y)) )
                             -- R method 'pearson'
------------------------------------------------------ END

"EXAMPLE from the text"

x =(1,3,5,10)
y =(2,4,6,20)

cov(x,y)          -- 23
covR(x,y)         -- 30.66
