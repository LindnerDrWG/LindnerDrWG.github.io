##| VectorCalculus : cartesian coordinates, section 3.1
##| https://lindnerdrwg.github.io/VectorCalculus-with-Eigenmath.pdf
##|         by Dr. W.G. Lindner, Leichlingen DE, 2026


"DEFINITIONS for curvilinear coordinates"
-- u : coordinates
-- f : scalar function
-- F : vector function
-- h : scale factors
-- Jac : Jacobi matrix
-----------------------------------------------------------------

F = (f1(),f2(),f3())

Grad(f) = ( d(f,u[1])/h[1], d(f,u[2])/h[2], d(f,u[3])/h[3] ) 

Div(F) = 1/Jac * ( d(Jac F[1]/h[1],u[1]) +
                   d(Jac F[2]/h[2],u[2]) + 
                   d(Jac F[3]/h[3],u[3]))

Curl(F)= 1/Jac *(h[1]*(d(h[3]*F[3],u[2]) - d(h[2]*F[2],u[3])),
                 h[2]*(d(h[1]*F[1],u[3]) - d(h[3]*F[3],u[1])),
                 h[3]*(d(h[2]*F[2],u[1]) - d(h[1]*F[1],u[2])))

Laplacian(f)= 1/Jac *( d(h[2]*h[3]/h[1]*d(f,u[1]),u[1]) + 
                       d(h[3]*h[1]/h[2]*d(f,u[2]),u[2]) +
                       d(h[1]*h[2]/h[3]*d(f,u[3]),u[3]) )

-----------------------------------------------------------------
-- REMARK
-- The terms for F, Grad(F) and Curl(F) calculates 'only' the 
-- coordinates of these objects in the cartesian coordinate system.
-- If wanted, you have to expand the result in the actual basis 
-- i.e. F=(x^2,y,z-1) ==  x^2*I + y*J +(z-1)*K 
-- with I,J,K as cartesian basis in R^3.

"========== Step-by-step procedure."

"x,y,z are the cartesian coordinates"

u = (x,y,z)           -- cartesian 3D coord
u

R = (x,y,z)           -- position vector of a point in cart.coord.
R                   

"tangent vectors to x,y,z curves:"

U1 = d(R,u[1])         -- alias e1 or E1, 1.st basis vector
U1

U2 = d(R,u[2])
U2

U3 = d(R,u[3])
U3

U123 =  d(R,u)         -- all tangent vectors collected as columns
U123

U = transpose(d(R,u))         
U                      -- unit vectors according to cart.coord's

"Jacobian"  

h(i) = sqrt(dot(U[i], U[i]))    -- scale factors
h    = (h(1), h(2), h(3) )  
h

Jac = h[1]* h[2]* h[3]          -- Jacobian
Jac

## alternative definition
## Jac = simplify(det(U))       -- from definition
## Jac 

"unit vectors in these directions"

e1 = U1/h[1]     -- i.e. Ex alias I
e1
e2 = U2/h[2]     -- i.e. Ey alias J
e2
e3 = U3/h[3]     -- i.e. Ez alias K
e3

"========== Check curvilinear formula's in Eigenmath syntax"

"Gradient of f:"
Grad(f(x,y,z))

"Divergence of F:"
F(x,y,z)=(f1(x,y,z),f2(x,y,z),f3(x,y,z))
F
Div(F(x,y,z))

"Curl of F:"
Curl(F(x,y,z))

"Laplacian of f:"
Laplacian(f(x,y,z))

"========== EXAMPLE: SOLUTION to 3.1.a using curvilinear coords:"

f(x,y,z) = x^2*y*z^3              -- f:R^3 --> R
F(x,y,z) = (x*z, -y^2, 2*x^2*y)   -- F:R^3 --> R^3

Grad(f)        -- i.e. \/f
Div(F)         -- i.e. \/ . F
Curl(F)        -- i.e. \/ x F
Laplacian(f)   -- i.e. /\f

"Check with build-in Eigenmath functions"

grad(f)
div(F)
curl(F)

-- laplacian(f) not defined in Eigenmath

laplacian(f) = div(grad(f))
laplacian(f)

"========== REMARK: describe the results in cartesian basis "

-- we expand the above results in the cartesian basis.
-- In this special case you see no difference to the above ..

Gradf = dot(Grad(f), (e1,e2,e3)) -- i.e. Grad(f)[1]*e1 + ..
Gradf

DivF = Div(F)              -- is scalar valued, no expansion ;) ;)
DivF

CurlF = dot(Curl(F), (e1,e2,e3))
CurlF

Laplacianf = Laplacian(f)  -- is scalar valued, no expansion ;)
Laplacianf

"========== SOLUTION to 3.1.a using direct definition (1')"

f(x,y,z) = x^2*y*z^3              -- f:R^3 --> R
F(x,y,z) = (x*z, -y^2, 2*x^2*y)   -- F:R^3 --> R^3

I = (1,0,0)
J = (0,1,0)
K = (0,0,1)

Gradf = d(f,x)*I + d(f,y)*J + d(f,y)*K     -- i.e. \/f
Gradf

DivF = d(F[1],x) + d(F[2],y) + d(F[3],z)   -- i.e. \/ . F
DivF

CurlF = (d(F[3],y)-d(F[2],z))*I + 
        (d(F[1],z)-d(F[3],x))*J +
        (d(F[2],x)-d(F[1],y))*K            -- i.e. \/ x f
CurlF

Laplacianf = d(f,x,x) + d(f,y,y)+ d(f,z,z)   -- i.e. /\f
Laplacianf

"========== SOLUTION to 3.1.a. using option set"

-- The derivation of the objects u, R, U, h, Jac, e1 ..
-- are stepwise shows to enhance your unterstanding.
-- When done, we collect the results in an OPTION SET 'cartesian':

cartesian = do(
  u = (x,y,z),                -- names of cartesian coords
  R = (x,y,z),                -- position vector of a point
  U = transpose(d(R,u)),      -- tangent vectors as columns
  h = (1,1,1),                -- scale factors
  Jac = h[1]* h[2]* h[3],     -- Jacobian determinant
  Ex = U[1]/h[1],             -- unit vectors for (x,y,z)
  Ey = U[2]/h[2],
  Ez = U[3]/h[3])

-- Now we calculate the vector analysis operators via a call
-- to 'cartesian':

cartesian      -- choose coordinate system

f(x,y,z) = x^2*y*z^3              -- f:R^3 --> R
F(x,y,z) = (x*z, -y^2, 2*x^2*y)   -- F:R^3 --> R^3

Grad(f)        -- i.e. \/f
Div(F)         -- i.e. \/ . F
Curl(F)        -- i.e. \/ x F
Laplacian(f)   -- i.e. /\f
