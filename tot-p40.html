# EIGENMATH

R(x) = (2*x)           -- position vector i.e. coordinate change 
Z    = d(R(x), x)      -- the Jacobian, i.e. the covariant basis
Z
g11 = dot(Z,Z)
g11
g   = ((g11))          -- matrix with one element
g
ug  = inv(g)
ug
uZ  = dot(ug,Z)        -- the contravariant basis
uZ
